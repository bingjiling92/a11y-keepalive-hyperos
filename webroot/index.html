<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A11y KeepAlive</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a;
  --txt:#e6e9ef; --sub:#8b93a7; --blue:#3b82f6; --green:#22c55e;
  --red:#ef4444; --amber:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt); padding:14px 14px 34px;
  font-size:15px; line-height:1.5;
}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 2px;}
.top h1{font-size:18px;font-weight:700;letter-spacing:.3px;}
.top .ver{font-size:12px;color:var(--sub);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
.card h2{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:14px;letter-spacing:.5px;
  display:flex;align-items:center;gap:7px;}
.card h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--blue);}
.status-row{display:flex;align-items:center;justify-content:space-between;}
.status-left{display:flex;align-items:center;gap:10px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:none;transition:.3s;}
.dot.on{background:var(--green);box-shadow:0 0 10px rgba(34,197,94,.75);animation:pulse 1.8s infinite;}
.dot.off{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,.6);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.status-text{font-size:15px;font-weight:600;}
.status-sub{font-size:12px;color:var(--sub);margin-top:9px;line-height:1.65;word-break:break-all;}
.switch{position:relative;width:54px;height:30px;flex:none;}
.switch input{display:none;}
.slider{position:absolute;inset:0;background:#3a4050;border-radius:30px;transition:.28s;cursor:pointer;}
.slider::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;
  transition:.28s;box-shadow:0 1px 4px rgba(0,0,0,.4);}
.switch input:checked + .slider{background:var(--green);}
.switch input:checked + .slider::before{transform:translateX(24px);}
.btns{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap;}
.btn{flex:1;min-width:74px;padding:11px 8px;border-radius:11px;font-size:14px;font-weight:600;
  cursor:pointer;transition:.15s;color:#fff;background:var(--card2);border:1px solid var(--line);}
.btn:active{transform:scale(.97);opacity:.85;}
.btn-primary{background:var(--blue);border-color:var(--blue);}
.btn-green{background:var(--green);border-color:var(--green);}
.btn-red{background:var(--red);border-color:var(--red);}
.btn-ghost{background:transparent;}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row label{font-size:14px;color:var(--txt);}
.row .desc{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.55;max-width:210px;}
input[type=number],textarea{
  background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
  padding:9px 11px;font-size:14px;font-family:inherit;outline:none;transition:.15s;
}
input[type=number]{width:88px;text-align:center;}
input[type=number]:focus,textarea:focus{border-color:var(--blue);}
textarea{width:100%;min-height:118px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;resize:vertical;}
.hint{font-size:11.5px;color:var(--sub);margin-top:9px;line-height:1.7;}
.logbox{background:#0b0d11;border:1px solid var(--line);border-radius:11px;padding:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.65;color:#b9c2d0;
  white-space:pre-wrap;word-break:break-all;max-height:250px;overflow-y:auto;}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:rgba(28,32,40,.97);border:1px solid var(--line);color:#fff;padding:11px 20px;
  border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.28s;z-index:99;
  box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:88vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:98;}
#mask.show{display:flex;}
.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fbbf24;
  border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-bottom:12px;display:none;}
.warn.show{display:block;}
</style>
</head>
<body>

<div class="top">
  <h1>♿ A11y KeepAlive</h1>
  <span class="ver" id="verText">v3.1-hotfix</span>
</div>

<div class="warn" id="envWarn">
  ⚠️ 未检测到 KernelSU WebUI 环境（ksu 接口不可用）。请从 KernelSU / APatch 管理器的模块页面打开本界面，而不是用普通浏览器。
</div>

<div class="card">
  <h2>保活状态</h2>
  <div class="status-row">
    <div class="status-left">
      <span class="dot" id="dot"></span>
      <div><div class="status-text" id="statusText">读取中…</div></div>
    </div>
    <label class="switch">
      <input type="checkbox" id="sw">
      <span class="slider" onclick="onSwitch()"></span>
    </label>
  </div>
  <div class="status-sub" id="statusSub"></div>
  <div class="btns">
    <button class="btn btn-green" onclick="doStart()">启动保活</button>
    <button class="btn btn-red" onclick="doStop()">停止保活</button>
    <button class="btn btn-ghost" onclick="refreshAll()">刷新</button>
  </div>
</div>

<div class="card">
  <h2>保活参数</h2>
  <div class="row">
    <div><label>检查间隔</label><div class="desc">单位秒。越小恢复越快，越耗电。推荐 15~60</div></div>
    <input type="number" id="cfgInterval" min="5" max="3600" placeholder="20">
  </div>
  <div class="row">
    <div><label>日志记录</label><div class="desc">关闭后不再写日志，进一步省电</div></div>
    <input type="number" id="cfgLog" min="0" max="1" placeholder="1">
  </div>
  <div class="row">
    <div><label>电池白名单</label><div class="desc">把保活应用加入 Doze 白名单，降低被杀概率</div></div>
    <input type="number" id="cfgWl" min="0" max="1" placeholder="1">
  </div>
  <div class="btns">
    <button class="btn btn-primary" onclick="saveConfig()">保存参数</button>
  </div>
</div>

<div class="card">
  <h2>保活应用</h2>
  <textarea id="apps" placeholder="每行一个包名，例如：&#10;com.example.app1&#10;com.example.app2"></textarea>
  <div class="hint">仅列表中的应用会被保持无障碍开关开启。保存后下一个检查周期自动生效，无需重启。</div>
  <div class="btns">
    <button class="btn btn-primary" onclick="saveApps()">保存列表</button>
    <button class="btn btn-ghost" onclick="loadApps()">重新加载</button>
  </div>
</div>

<div class="card">
  <h2>运行日志</h2>
  <div class="logbox" id="logbox">加载中…</div>
  <div class="btns">
    <button class="btn btn-ghost" onclick="loadLog()">刷新日志</button>
    <button class="btn btn-ghost" onclick="clearLog()">清空日志</button>
  </div>
</div>

<div id="toast"></div>
<div id="mask"><div class="spinner"></div></div>

<script src="main.js"></script>
</body>
</html>
